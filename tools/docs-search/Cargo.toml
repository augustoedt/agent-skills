[package]
name = "docs-search"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Local, model-independent retrieval for project documentation"
license = "MIT"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3.23"
